services:
  - type: web
    name: hk-ele-teacher-database
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: python -m compileall -q server.py api
    startCommand: python server.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/hkele.sqlite
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_API_GET_RATE_PER_MINUTE
        value: "300"
      - key: PUBLIC_API_POST_RATE_PER_MINUTE
        value: "60"
      - key: ALLOW_INDEXING
        value: "false"
    disk:
      name: hkele-data
      mountPath: /var/data
      sizeGB: 2
